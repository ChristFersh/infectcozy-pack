#Top-level on/off switches for major Spore Inquisition systems.
[toggles]
	#Enable proto Ordeals (timed boss waves). false fully disables them.
	ordealsEnabled = true
	#Enable calamity Raids (Eclipse). false fully disables them.
	calamityRaids = true
	#true: world corruption rises to 100% and triggers Finalitas automatically (vanilla behavior).
	#false: natural corruption is capped at 99%; only an offering (given at max corruption) can
	#       begin Finalitas, which plays the lore sequence (~90s) while the dimension warms up.
	automaticFinalitas = false
	#Enable the death-dream / parallax event. false disables it.
	dreamEnabled = true

#Numeric tuning knobs. These seed scoreboards the datapack reads.
[tuning]
	#World corruption added per Proto / Rednight mound every 30-minute cycle. Default 1.
	# Default: 1
	# Range: 0 ~ 10000
	corruptionRate = 0
	#Corruption granted by the tier-1 offering (gift1). Default 25.
	# Default: 25
	# Range: 0 ~ 10000
	offering1Amount = 25
	#Corruption granted by the tier-2 offering (gift2). Default 50.
	# Default: 50
	# Range: 0 ~ 10000
	offering2Amount = 50
	#Corruption granted by the tier-3 offering (gift3). Default 100.
	# Default: 100
	# Range: 0 ~ 10000
	offering3Amount = 100
	#Corruption level at which ordeal wave tier 1 escalation begins. Default 70.
	# Default: 70
	# Range: 0 ~ 10000
	ordealThreshold1 = 70
	#Corruption level for ordeal wave tier 2. Default 140.
	# Default: 140
	# Range: 0 ~ 10000
	ordealThreshold2 = 140
	#Corruption level for ordeal wave tier 3. Default 210.
	# Default: 210
	# Range: 0 ~ 10000
	ordealThreshold3 = 210
	#Corruption level for ordeal wave tier 4. Default 280.
	# Default: 280
	# Range: 0 ~ 10000
	ordealThreshold4 = 280
