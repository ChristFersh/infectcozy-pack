# MCG Core
# trust_links      true after you accept the link dialog once; links then open directly.
#                  Set false to be asked every time.
# catalog_updates  Once a day, fetch the "More from MCG" list from minecraft-guides.com
#                  and any updated guide pages it lists. Nothing is sent. Set false to
#                  use only what is built into the jars.
# interface_text_size  How big the book's text is, in screen pixels per pixel of the
#                  font. An absolute size, so the book stays put when you change GUI
#                  Scale instead of jumping with it, and every step lands on whole
#                  pixels. 1-8, clamped to what the window fits. The conversation box
#                  follows it too. There is a control on the book's Settings ribbon.
# seen_key_hint    Set true once the book has told you which key opens it. Set it back
#                  to false to see that line again.
# give_book_on_join  Hand a player the MCG Guidebook the first time they join a world.
#                  Once each, remembered per world. Set false for a silent first morning;
#                  the key opens the book either way.
# track_progress   Remember which items you have picked up, per world, and show it in
#                  the book. Local only, nothing is sent. Set false to turn it off.
#                  track_progress, spoiler_free and item_tooltips are per guide: each guide
#                  has its own Settings page, saved as <key>.<guide mod id>; the bare key is
#                  the default for guides that have not been set.
# spoiler_free     Hide an item's tooltip, guide and recipe until you have found one.
#                  Off by default: the book is a reference first.
# item_tooltips    Add "Press G for the Guidebook" to items a guide covers. Set false
#                  to leave tooltips alone; the key still works.
catalog_updates=true
give_book_on_join=true
interface_text_size=3
item_tooltips=true
seen_key_hint=true
spoiler_free=false
track_progress=true
trust_links=false
