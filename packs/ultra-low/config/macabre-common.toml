#Full-set armor bonuses (additive attribute modifier amounts).
[armor_bonuses]
	#Baal set: gravity attribute change (negative = float more).
	# Default: -0.04
	# Range: -1.0 ~ 1.0
	baalGravity = -0.04
	#Baal set: bonus movement speed.
	# Default: 0.2
	# Range: 0.0 ~ 10.0
	baalMovementSpeed = 0.2
	#Gomoria set: bonus block reach.
	# Default: 3.5
	# Range: 0.0 ~ 64.0
	gomoriaBlockReach = 3.5
	#Gomoria set: bonus entity reach.
	# Default: 3.0
	# Range: 0.0 ~ 64.0
	gomoriaEntityReach = 3.0
	#Valamon set: bonus attack knockback.
	# Default: 2.0
	# Range: 0.0 ~ 10.0
	valamonAttackKnockback = 2.0
	#Valamon set: bonus attack speed.
	# Default: 4.0
	# Range: 0.0 ~ 100.0
	valamonAttackSpeed = 4.0
	#Gargamaw set: bonus knockback resistance.
	# Default: 2.0
	# Range: 0.0 ~ 10.0
	gargamawKnockbackResistance = 2.0
	#Gomoria/Baal/Valamon sets: bonus max health (in half-hearts).
	# Default: 20.0
	# Range: 0.0 ~ 1000.0
	setMaxHealthTier1 = 20.0
	#Gargamaw set: bonus max health (in half-hearts).
	# Default: 40.0
	# Range: 0.0 ~ 1000.0
	gargamawMaxHealthTier2 = 40.0
	#Morphegor set: bonus swim speed.
	# Default: 6.0
	# Range: 0.0 ~ 100.0
	morphegorSwimSpeed = 6.0
	#Morphegor set: bonus attack damage.
	# Default: 11.0
	# Range: 0.0 ~ 1000.0
	morphegorAttackDamage = 11.0

#Spawn caps for static decoration/structure entities.
[spawns]
	#Max decoration entities of a type within the radius before spawns are cancelled.
	# Default: 3
	# Range: 1 ~ 64
	decorationCap = 3
	#Radius (blocks) for the decoration density check.
	# Default: 16.0
	# Range: 1.0 ~ 128.0
	decorationRadius = 16.0
	#Radius (blocks) within which duplicate whirlpools are cancelled.
	# Default: 16.0
	# Range: 1.0 ~ 128.0
	whirlpoolRadius = 16.0

#Boss-set damage interaction: while wearing a boss's full armor set, that boss hits you harder but every OTHER boss hits you softer.
[boss_sets]
	#Damage multiplier from the SAME boss whose set you wear (1.25 = +25%).
	# Default: 1.25
	# Range: 0.0 ~ 100.0
	ownSetDamageMultiplier = 1.25
	#Damage multiplier from any OTHER boss while wearing a boss set (0.85 = -15%).
	# Default: 0.85
	# Range: 0.0 ~ 100.0
	otherBossDamageMultiplier = 0.85

#Toggles for the merged optimization/compatibility fixes.
[fixes]
	#Spawn caps, frozen decoration entities, suffocation immunity, whirlpool dedup, whisper mute.
	entityRelatedFixes = true
	#Apply full-set armor bonuses as attribute modifiers (mod/Curios compatible).
	armorAttributeFix = true
	#Enable the boss-set damage interaction (own boss +25%, other bosses -15%).
	bossSetDamageFix = true

#Player weapons and armour. The macabre weapon/armour families sit on a clean ladder above netherite,
#applied as attribute modifiers (other mods and Curios keep working). The bespoke special weapons are
#left alone.
[player_gear]
	#Use the macabre weapon/armour ladder (false = the items' original values).
	gearRebalance = true
	#Multiplier on every macabre weapon's damage (1.5 = +50%).
	# Default: 1.0
	# Range: 0.1 ~ 10.0
	weaponDamageMultiplier = 1.0
	#Multiplier on every macabre armour piece's armour points and toughness.
	# Default: 1.0
	# Range: 0.1 ~ 10.0
	armorMultiplier = 1.0
	#Damage of the boss signature weapons (hemorrhage sword, the cleave, soaked gorescythe...),
	#before weaponDamageMultiplier.
	# Default: 32.0
	# Range: 1.0 ~ 1000.0
	bossWeaponDamage = 32.0
	#Extra multiplier on the five boss armour sets only (on top of armorMultiplier).
	# Default: 1.0
	# Range: 0.1 ~ 10.0
	bossArmorMultiplier = 1.0

#Macabre mobs (not bosses). Health and damage are multiplied on top of each mob's own stats.
[mobs]
	#Health multiplier for macabre mobs.
	# Default: 2.0
	# Range: 0.1 ~ 50.0
	mobHealthMultiplier = 2.0
	#Damage multiplier for macabre mobs.
	# Default: 2.0
	# Range: 0.0 ~ 50.0
	mobDamageMultiplier = 2.0
	#Health multiplier for the big ones instead (marrow, brainhemoth, trunk, handtree, giant).
	# Default: 3.0
	# Range: 0.1 ~ 50.0
	bigMobHealthMultiplier = 3.0
	#Damage multiplier for the big ones.
	# Default: 3.0
	# Range: 0.0 ~ 50.0
	bigMobDamageMultiplier = 3.0

#Bosses: the five False Prophets (and Morphegor's split form) and the Dead God.
[bosses]
	#Flat extra health every boss gets (half-hearts).
	# Default: 320.0
	# Range: 0.0 ~ 100000.0
	bossHealthBonus = 320.0
	#Multiplier on boss health, after the bonus (2.0 = a fight twice as long).
	# Default: 1.0
	# Range: 0.1 ~ 50.0
	bossHealthMultiplier = 1.0
	#Multiplier on damage bosses and their minions/projectiles deal to players.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	bossDamageMultiplier = 1.0
	#After a boss uses an ability it waits this long before the next (ticks, 20 = 1 s).
	# Default: 30
	# Range: 0 ~ 600
	abilityCooldownTicks = 30
	#...plus a random extra wait between these two (ticks). Lower = relentless.
	# Default: 1
	# Range: 0 ~ 600
	abilityGapMinTicks = 1
	# Default: 20
	# Range: 1 ~ 1200
	abilityGapMaxTicks = 20

#Time-based difficulty: every few nights a player spends in a macabre dimension, macabre mobs get
#a little stronger (health and damage), up to a cap.
[difficulty]
	#Mobs grow stronger over time.
	timeScaling = true
	#Nights per step.
	# Default: 3
	# Range: 1 ~ 1000
	nightsPerStep = 3
	#Health and damage added per step, in percent.
	# Default: 3.0
	# Range: 0.0 ~ 1000.0
	percentPerStep = 3.0
	#The most it can reach, as a multiplier of the original stats (3.0 = triple).
	# Default: 3.0
	# Range: 1.0 ~ 100.0
	maxMultiplier = 3.0

#Pit jumpscares.
[jumpscares]
	#Jumpscares happen at all.
	jumpscares = true
	#How often (1.0 = normal, 2.0 = twice as often, 0.5 = half).
	# Default: 1.0
	# Range: 0.0 ~ 1000.0
	frequencyMultiplier = 1.0
	#The ratio between the three kinds (relative weights, 0 switches one off).
	#The first face sequence:
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	primaryWeight = 1.0
	#The second face sequence:
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	secondaryWeight = 1.0
	#The reaching hands:
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	reachingHandsWeight = 1.0
	#A jumpscare also slows, blinds, fatigues and nauseates you briefly.
	jumpscareEffects = true
	#How long those effects last (ticks).
	# Default: 120
	# Range: 0 ~ 12000
	effectDurationTicks = 120

#World events.
[events]
	#Chance each night in the Pit becomes a Blood Moon (0.05 = 5%).
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	bloodMoonChance = 0.05

#Severed: limbs can be cut off macabre mobs, and dead mobs fall as physics ragdolls (drawn by each client).
[severed]
	#Hits can sever limbs (legs slow, arms weaken, losing the head bleeds out).
	severing = true
	#Chance (percent) that a qualifying hit severs the limb it landed on.
	# Default: 33
	# Range: 0 ~ 100
	severChancePercent = 33
	#Dead macabre mobs (not bosses) collapse as ragdolls instead of sinking into the ground.
	ragdolls = true
