enableNearestCommand = false

[locate]
	#Ordered radii in blocks used for locate searches.
	locateRings = [6400, 16000, 32000, 64000, 128000, 256000]
	# Default: 1
	# Range: 1 ~ 8
	locateThreadCount = 1
	# Default: 30
	# Range: 1 ~ 240
	cacheDurationMinutes = 30
	# Default: 8
	# Range: 1 ~ 128
	cacheChunkGranularity = 8
	# Default: 1.5
	# Range: 1.0 ~ 8.0
	biomeSampleRadiusMultiplier = 1.5
	# Default: 1.75
	# Range: 1.0 ~ 8.0
	biomeSampleStepMultiplier = 1.75
	enableFeatureLocateCommand = false
	adaptiveSearchEnabled = true

[poi]
	# Default: 256
	# Range: 16 ~ 4096
	poiSearchRadius = 256

[commands]
	enableCommandErrorFixer = true

[queue]
	# Default: 32
	# Range: 1 ~ 1024
	maxPending = 32
	# Default: 120
	# Range: 5 ~ 3600
	searchTimeoutSeconds = 120

[cache]
	# Default: 512
	# Range: 16 ~ 65536
	maxEntries = 512

[index]
	enabled = true
	# Default: 8192
	# Range: 64 ~ 100000
	maxEntries = 8192
	# Default: 90
	# Range: 1 ~ 3650
	expiryDays = 90
	# Default: 30
	# Range: 1 ~ 10080
	verificationMinutes = 30

[teleport]
	# Default: 1
	# Range: 0 ~ 8
	preloadRadiusChunks = 1
	# Default: 0
	# Range: 0 ~ 60
	countdownSeconds = 0
	countdownEnabled = true
	# Default: 30
	# Range: 5 ~ 300
	timeoutSeconds = 30
	# Default: 8
	# Range: 1 ~ 32
	safeHorizontalRadius = 8
	# Default: 48
	# Range: 4 ~ 128
	safeVerticalRange = 48
	allowWaterLanding = false
	allowLavaLanding = false
	allowFireLanding = false
	allowPowderSnowLanding = false
	returnPointEnabled = false

[integrations]
	biomeSpy = true
	compassMods = true
	asyncLocatorConflictMode = true

[benchmark]
	enabled = false
